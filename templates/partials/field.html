<div class="field{% if field.errors %} has-error{% endif %}{% if full %} field-full{% endif %}">
  <label for="{{ field.id_for_label }}">
    {{ field.label }}{% if field.field.required %}<span class="req">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<span class="helptext">{{ field.help_text|safe }}</span>{% endif %}
  {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
</div>
